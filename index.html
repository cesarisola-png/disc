// ── ALGORITMO DISC ────────────────────────────────────────────────────────────
const CAL_U=[47.46,34.12,51.43,24.05], CAL_M=[41.67,42.67,30.00,35.29];
const DC={D:'#c0392b',I:'#e67e22',S:'#27ae60',C:'#2980b9'};

function pKey(k){if(!k)return[-1,-1,-1,-1];const m={D:0,I:1,S:2,C:3,'*':-1};return k.split('').map(c=>m[c]??-1);}
function scoreW(ans,kf){const r=[0,0,0,0];ans.forEach(({mi,li},i)=>{const k=pKey(SETS[i][kf]);for(let p=0;p<4;p++){if(k[p]===-1)continue;r[k[p]]+=(p===mi?3:p===li?0:1);}});return r;}
function normArr(r,cal){return r.map((v,i)=>Math.min(100,Math.max(0,Math.round(v/cal[i]*100))));}
function computeProfiles(ans){
  const U=normArr(scoreW(ans,'k1'),CAL_U),M=normArr(scoreW(ans,'k2'),CAL_M),C=U.map((v,i)=>Math.round((v+M[i])/2));
  const o=a=>({D:a[0],I:a[1],S:a[2],C:a[3]});return{U:o(U),M:o(M),C:o(C)};
}

// ── 12 RASGOS DE PERSONALIDAD ─────────────────────────────────────────────────
// Fórmulas según "Rasgos de personalidad actualizados" (Lic. César Isola):
// cada rasgo = diferencia entre dos factores DISC, normalizada a 0-100 (50 = neutro)
const RASGOS_ORDEN=["Independencia","Entusiasmo","Amistoso","Cooperativismo","Exactitud",
  "Automotivacion","Auto Confianza","Sensitividad","Pensador Objetivo","Persistencia","Paciencia","Eficiencia"];

function derivarRasgos(d,i,s,c){
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const diff=(a,b)=>clamp(50+(a-b)/2);
  return {
    'Independencia'     : diff(d,c),   // D/C
    'Entusiasmo'        : diff(i,s),   // I/S
    'Amistoso'          : diff(i,d),   // I/D
    'Cooperativismo'    : diff(c,d),   // C/D
    'Exactitud'         : diff(c,i),   // C/I
    'Automotivacion'    : diff(d,s),   // D/S
    'Auto Confianza'    : diff(i,c),   // I/C
    'Sensitividad'      : diff(c,s),   // C/S
    'Pensador Objetivo' : diff(s,i),   // S/I
    'Persistencia'      : diff(s,c),   // S/C
    'Paciencia'         : diff(s,d),   // S/D
    'Eficiencia'        : diff(d,i),   // D/I
  };
}

// ── INDICADOR DE STRESS (movimiento Underlying → Mask) ────────────────────────
function calcularStress(traitsU,traitsM){
  const detalle={};let sumAbs=0,sumPos=0,sumNeg=0;
  RASGOS_ORDEN.forEach(k=>{
    const u=traitsU[k],m=traitsM[k],delta=m-u;
    let tipo='estable'; if(delta>5)tipo='positivo'; else if(delta<-5)tipo='negativo';
    detalle[k]={u,m,delta,tipo};
    sumAbs+=Math.abs(delta); if(delta>0)sumPos+=delta; else sumNeg+=Math.abs(delta);
  });
  const indice=Math.round(sumAbs/RASGOS_ORDEN.length);
  const ordenadoPorMovimiento=Object.entries(detalle).sort((a,b)=>Math.abs(b[1].delta)-Math.abs(a[1].delta));
  const top=ordenadoPorMovimiento && ordenadoPorMovimiento.length>0 ? ordenadoPorMovimiento[0] : null;
  
  // Calcular los 3 rasgos más altos (por valor Underlying)
  const top3Rasgos=Object.entries(detalle)
    .sort((a,b)=>b[1].u-a[1].u)
    .slice(0,3)
    .map(([nombre,{u,m,delta}])=>({nombre,u,m,delta}));
  
  return{
    detalle, indice,
    tendencia: sumPos>sumNeg+5?'positiva':(sumNeg>sumPos+5?'negativa':'equilibrada'),
    rasgoMax: top ? top[0] : 'Ninguno', 
    deltaMax: top ? top[1].delta : 0,
    top3Rasgos: top3Rasgos,
  };
}

// ── ROLES ─────────────────────────────────────────────────────────────────────
function calcularTop3Roles(rasgos){
  const eng={'Independencia':'Independence','Entusiasmo':'Enthusiasm','Amistoso':'Friendliness','Cooperativismo':'Cooperativeness',
    'Exactitud':'Accuracy','Automotivacion':'Self-motivation','Auto Confianza':'Self-confidence','Sensitividad':'Sensitivity',
    'Pensador Objetivo':'Thoughtfulness','Persistencia':'Persistence','Paciencia':'Patience','Eficiencia':'Efficiency'};
  const roles={'Pionero':['Independence','Self-motivation','Efficiency'],'Relacionista':['Enthusiasm','Friendliness','Self-confidence'],
    'Apoyo':['Cooperativeness','Patience','Sensitivity'],'Analista':['Accuracy','Thoughtfulness','Persistence'],
    'Motivador':['Enthusiasm','Cooperativeness','Friendliness'],'Innovador':['Independence','Enthusiasm','Self-motivation'],
    'Finalizador':['Persistence','Efficiency','Accuracy'],'Especialista':['Accuracy','Thoughtfulness','Self-motivation'],
    'Ancla':['Patience','Accuracy','Cooperativeness']};
  const de={};Object.entries(rasgos).forEach(([k,v])=>{de[eng[k]]=v;});
  const top=Object.entries(de).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  const pts={};Object.entries(roles).forEach(([rol,rc])=>{let s=0;top.forEach((r,i)=>{if(rc.includes(r))s+=(12-i);});pts[rol]=s;});
  const ord=Object.entries(pts).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  return[ord[0],ord[1],ord[2]];
}

// ── CONSISTENCIA (indicador de confiabilidad, uso interno RRHH) ───────────────
const PARES_CONSIST = [[0,6],[1,22],[3,9],[4,13],[8,10],[11,16],[14,20],[15,17],[18,7],[21,23]];
function calcularConsistencia(ans) {
  let iguales=0, total=0;
  PARES_CONSIST.forEach(([ia,ib])=>{
    const fa=pKey(SETS[ia].k1)[ans[ia].mi];
    const fb=pKey(SETS[ib].k1)[ans[ib].mi];
    if(fa!==-1&&fb!==-1){total++;if(fa===fb)iguales++;}
  });
  return total>0?Math.round((iguales/total)*100)/100:0.7;
}

const TIMER = {
  start: null, setTimes: [], setStart: null,
  startSet(i) { this.setStart=Date.now(); },
  endSet(i) { if(this.setStart) { this.setTimes[i]=(Date.now()-this.setStart)/1000; this.setStart=null; } },
  totalSec() { return this.start ? Math.round((Date.now()-this.start)/1000) : 0; },
  fmt(s) { const m=Math.floor(s/60),sec=s%60; return `${m}m ${sec.toString().padStart(2,'0')}s`; },
  maxPausa() {
    if(!this.setTimes.length) return {sec:0,set:0};
    let max=0,idx=0; this.setTimes.forEach((t,i)=>{if(t>max){max=t;idx=i;}});
    return {sec:Math.round(max),set:idx+1};
  },
  semaforo() {
    const total=this.totalSec();
    if(total<240)  return{color:'red',   cls:'sem-red',   txt:'Muy rápida (< 4 min)'};
    if(total<600)  return{color:'green', cls:'sem-green', txt:'Normal (4–10 min)'};
    if(total<1800) return{color:'green', cls:'sem-green', txt:'Reflexiva (10–30 min)'};
    return{color:'orange',cls:'sem-yellow',txt:'Inusualmente lenta (> 30 min)'};
  }
};

function radarSVG(labels,seriesA,seriesB){
  const n=labels.length,cx=170,cy=170,R=118;
  const angle=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(val,i)=>{const r=R*val/100;return[cx+r*Math.cos(angle(i)),cy+r*Math.sin(angle(i))];};
  const gridPoly=frac=>labels.map((_,i)=>pt(frac*100,i).join(',')).join(' ');
  const axisLines=labels.map((_,i)=>{const[x,y]=pt(100,i);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;}).join('');
  const grids=[.25,.5,.75,1].map(f=>`<polygon points="${gridPoly(f)}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`).join('');
  const labelsHtml=labels.map((lab,i)=>{const[x,y]=pt(132,i);return`<text x="${x}" y="${y}" font-size="8.5" fill="#6b7280" text-anchor="middle">${lab}</text>`;}).join('');
  const polyA=`<polygon points="${labels.map((_,i)=>pt(seriesA[i],i).join(',')).join(' ')}" fill="#2980b933" stroke="#2980b9" stroke-width="2"/>`;
  const polyB=seriesB?`<polygon points="${labels.map((_,i)=>pt(seriesB[i],i).join(',')).join(' ')}" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="4,3"/>`:'';
  return`<svg viewBox="0 0 340 340" style="width:100%;max-width:380px;display:block;margin:8px auto">${grids}${axisLines}${polyA}${polyB}${labelsHtml}</svg>`;
}

function hReporte(){
  const d=ST.reporteData;
  const U={D:d.d_score,I:d.i_score,S:d.s_score,C:d.c_score};
  const M=d.mask_scores||{D:0,I:0,S:0,C:0};
  const Mn={D:M.d??M.D??0,I:M.i??M.I??0,S:M.s??M.S??0,C:M.c??M.C??0};
  const C={D:Math.round((U.D+Mn.D)/2),I:Math.round((U.I+Mn.I)/2),S:Math.round((U.S+Mn.S)/2),C:Math.round((U.C+Mn.C)/2)};
  const traitsU={}; RASGOS_ORDEN.forEach(k=>traitsU[k]=d[k.toLowerCase().replace(' ','_')]??0);
  const traitsM=d.rasgos_mask||{};
  const stress=d.stress||calcularStress(traitsU,traitsM);
  const rolColor={'Pionero':'#E74C3C','Relacionista':'#E67E22','Apoyo':'#2ECC71','Analista':'#3498DB','Motivador':'#9B59B6','Innovador':'#1ABC9C','Finalizador':'#F39C12','Especialista':'#34495E','Ancla':'#7F8C8D'};
  const rc=rolColor[d.rol_preferido_1]||'#2980b9';

  const rasgoRows=RASGOS_ORDEN.map(k=>{
    const u=traitsU[k]??0, m=traitsM[k]??(stress.detalle?.[k]?.m??u);
    const delta=stress.detalle?.[k]?.delta ?? (m-u);
    const tipo=stress.detalle?.[k]?.tipo ?? (delta>5?'positivo':delta<-5?'negativo':'estable');
    const badge=tipo==='positivo'?`<span class="stress-badge stress-pos">▲ +${delta}</span>`:tipo==='negativo'?`<span class="stress-badge stress-neg">▼ ${delta}</span>`:`<span class="stress-badge stress-neu">≈</span>`;
    const lo=Math.min(u,m),hi=Math.max(u,m);
    return`<div class="rasgo-row">
      <span style="font-size:11px">${k}</span>
      <div class="rasgo-track">
        <div class="rasgo-seg" style="left:${lo}%;width:${Math.max(hi-lo,1)}%"></div>
        <div class="rasgo-dotU" style="left:${u}%"></div>
        <div class="rasgo-dotM" style="left:${m}%"></div>
      </div>
      ${badge}
    </div>`;
  }).join('');

  return`
  <div class="no-print" style="margin-bottom:10px">
    <button class="btn" id="btnVolverBusqueda">← Nueva búsqueda</button>
    <button class="btn btn-primary" onclick="window.print()" style="float:right">🖨️ Imprimir / Guardar PDF</button>
  </div>
  <div style="text-align:center;padding:.6rem 0">
    <div style="font-size:10px;font-weight:600;color:#2980b9;letter-spacing:1px;text-transform:uppercase">REPORTE DISC INDIVIDUAL</div>
    <span class="report-only-flag">Solo visible para la empresa, no el candidato</span>
    <h2 style="font-size:19px;font-weight:600;margin:6px 0 2px">${d.colaborador}</h2>
    <p style="font-size:11px;color:var(--text2)">${d.empresa}${d.unidad_de_negocio?' · '+d.unidad_de_negocio:''}${d.fecha_nacimiento?' · Nac.: '+d.fecha_nacimiento:''}</p>
  </div>

  <div style="background:${rc}15;border:1px solid ${rc}40;border-radius:var(--radius-lg);padding:1rem;margin:12px 0;text-align:center">
    <p style="font-size:10px;font-weight:600;color:${rc};text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Rol principal</p>
    <p style="font-size:22px;font-weight:700;color:${rc};margin-bottom:2px">${d.rol_preferido_1}</p>
    <p style="font-size:11px;color:var(--text2)">Secundario: ${d.rol_preferido_2} · Terciario: ${d.rol_preferido_3}</p>
  </div>

  <div class="card" style="margin-bottom:12px">
    <p style="font-size:12px;font-weight:600;margin-bottom:4px">Perfil de Rasgos — Gráfico Radial</p>
    <p style="font-size:10px;color:var(--text2);margin-bottom:4px">🔵 Underlying (natural) · 🟠 Mask (bajo presión, línea punteada)</p>
    ${radarSVG(RASGOS_ORDEN,RASGOS_ORDEN.map(k=>traitsU[k]??0),RASGOS_ORDEN.map(k=>traitsM[k]??traitsU[k]??0))}
  </div>

  <div class="card" style="margin-bottom:12px">
    ${rolBlock(1,d.rol_preferido_1)}${rolBlock(2,d.rol_preferido_2)}${rolBlock(3,d.rol_preferido_3)}
  </div>

  <div class="card" style="margin-bottom:12px">
    <p style="font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text)">🔵 Perfiles DISC (Scores 0-100)</p>
    <p style="font-size:10px;color:var(--text2);margin-bottom:12px">Tres perspectivas del perfil behavioral</p>
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      ${barBlock('🔵 Underlying','Natural / Instintivo',U)}
      ${barBlock('🟠 Mask','Bajo Presión / Esperado',Mn)}
      ${barBlock('🟡 Compuesto','Promedio de Ambos',C)}
    </div>
    <div style="background:rgba(41,128,185,.08);border-left:3px solid #2980b9;padding:10px;border-radius:4px;font-size:10px;color:var(--text2);line-height:1.6">
      <strong>Interpretación:</strong> Underlying muestra el estilo natural. Mask muestra cómo se adapta bajo presión. Compuesto es el promedio de ambas perspectivas.
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <p style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text)">🎯 3 Rasgos más destacados</p>
    <p style="font-size:10px;color:var(--text2);margin-bottom:12px">Los rasgos de mayor intensidad en el perfil natural (Underlying)</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      ${stress.top3Rasgos.map((r,i)=>`
        <div style="flex:1;min-width:120px;background:rgba(41,128,185,.08);border:1px solid rgba(41,128,185,.2);padding:12px;border-radius:6px">
          <div style="font-size:11px;font-weight:700;color:#2980b9;margin-bottom:4px">${i+1}. ${r.nombre}</div>
          <div style="font-size:18px;font-weight:700;color:#2980b9;margin-bottom:4px">${Math.round(r.u)}</div>
          <div style="font-size:9px;color:var(--text2)">Intensidad natural</div>
          ${Math.abs(r.delta)>0?`<div style="font-size:9px;color:var(--text2);margin-top:4px">Ajuste bajo presión: ${r.delta>0?'+':''}${Math.round(r.delta)}</div>`:''}
        </div>
      `).join('')}
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <p style="font-size:13px;font-weight:700;margin-bottom:3px;color:var(--text)">📊 Puntajes por Rasgo (0-100)</p>
    <p style="font-size:10px;color:var(--text2);margin-bottom:12px">Movimiento del perfil Underlying → Mask + Indicador de Stress</p>
    <div style="background:rgba(41,128,185,.06);padding:8px 10px;border-radius:4px;margin-bottom:10px;font-size:9px;color:var(--text2)">
      🔵 Punto azul = Underlying (natural) · 🟠 Punto naranja = Mask (bajo presión) · 
      🟠 Rojo = stress positivo (se exige más) · 🟣 Púrpura = stress negativo (se reprime) · ⚪ Gris = estable
    </div>
    ${rasgoRows}
  </div>

  <div class="card" style="margin-bottom:12px">
    <p style="font-size:12px;font-weight:600;margin-bottom:8px">Indicador de Stress</p>
    <div class="confiab-row"><span style="color:var(--text2)">Índice de stress (0–100)</span><span style="font-weight:700">${stress.indice}</span></div>
    <div class="confiab-row"><span style="color:var(--text2)">Tendencia bajo presión</span>
      <span style="font-weight:700">${stress.tendencia==='positiva'?'Se exige más de lo natural':stress.tendencia==='negativa'?'Tiende a replegarse / reprimirse':'Equilibrada'}</span></div>
    <div class="confiab-row"><span style="color:var(--text2)">Rasgo con mayor movimiento</span><span style="font-weight:700">${stress.rasgoMax} ${stress.deltaMax!==0?`(${stress.deltaMax>0?'+':''}${stress.deltaMax})`:''}</span></div>
    <div style="margin-top:10px;padding:10px;background:var(--bg2);border-radius:var(--radius)">
      <p style="font-size:11px;color:var(--text2);line-height:1.6;margin:0">
        ${stress.indice<10?'✓ Baja adaptación entre el estilo natural y el estilo bajo presión — perfil estable en distintos contextos.':
          stress.indice<20?'⚠️ Adaptación moderada. Sostenida en el tiempo puede generar cierto desgaste si el entorno exige mantenerla siempre.':
          '⚠️ Adaptación alta entre Underlying y Mask. Sostenida en el tiempo es una señal de riesgo de desgaste / burnout — vale la pena conversarlo.'}
      </p>
    </div>
  </div>

  ${d.info_general?`<div class="card" style="margin-bottom:12px">
    <p style="font-size:12px;font-weight:600;margin-bottom:4px">Información general</p>
    <p style="font-size:11px;color:var(--text2);white-space:pre-wrap">${d.info_general}</p>
  </div>`:''}

  ${(d.tiempo_evaluacion_seg||d.consistencia_interna)?`<div class="card">
    <p style="font-size:12px;font-weight:600;margin-bottom:6px">Confiabilidad de la evaluación</p>
    <div class="confiab-row"><span style="color:var(--text2)">Tiempo total</span><span style="font-weight:600">${TIMER.fmt(d.tiempo_evaluacion_seg||0)}</span></div>
    <div class="confiab-row"><span style="color:var(--text2)">Consistencia interna</span><span style="font-weight:600">${d.consistencia_interna||'—'}%</span></div>
  </div>`:''}
  `;
}

// ── EVENTOS ───────────────────────────────────────────────────────────────────
function attachEvents(){
  document.getElementById('btnEmpleado')?.addEventListener('click',()=>{ST.modo='empleado';ST.screen='datos';ST.error=null;render();});
  document.getElementById('btnCandidato')?.addEventListener('click',()=>{ST.modo='candidato';ST.screen='datos';ST.error=null;render();});
  document.getElementById('btnBackModo')?.addEventListener('click',()=>{ST.screen='modo';ST.error=null;ST.empleadoData=null;render();});

  ['fLegajo','fApellido','fNombre','fFechaNac','fSexo','fEmpresa','fUnidad','fInfoGeneral'].forEach((id,idx)=>{
    const keys=['legajo','apellido','nombre','fechaNacimiento','sexo','empresa','unidad','infoGeneral'];
    const el=document.getElementById(id);
    el?.addEventListener('input',e=>{ST.form[keys[idx]]=e.target.value;});
    el?.addEventListener('change',e=>{ST.form[keys[idx]]=e.target.value;});
  });

  document.getElementById('btnBuscar')?.addEventListener('click',async()=>{
    const legajo=document.getElementById('fLegajo')?.value?.trim();
    if(!legajo){ST.error='Ingresá tu número de legajo.';render();return;}
    ST.form.legajo=legajo;
    const btn=document.getElementById('btnBuscar');
    btn.innerHTML='<span class="spinner"></span>Buscando...';btn.disabled=true;
    try{
      const rows=await sbGet('colaboradores',{employee_id_number:legajo});
      if(!rows||rows.length===0){ST.error=`No encontramos un empleado con legajo ${legajo}. Verificá el número o consultá a RRHH.`;ST.empleadoData=null;}
      else{ST.empleadoData=rows[0];ST.error=null;}
    }catch(e){ST.error='Error al conectar con el sistema. Intentá de nuevo.';}
    render();
  });

  document.getElementById('btnIniciar')?.addEventListener('click',()=>{
    const nombre=document.getElementById('fNombre')?.value?.trim()||ST.empleadoData?.colaborador?.split(',')[1]?.trim()||'';
    const apellido=document.getElementById('fApellido')?.value?.trim()||ST.empleadoData?.colaborador?.split(',')[0]?.trim()||'';
    const empresa=document.getElementById('fEmpresa')?.value?.trim()||ST.empleadoData?.empresa||'';
    if(!empresa||(!nombre&&!apellido)){ST.error='Completá al menos empresa y nombre.';render();return;}
    ST.form.nombre=nombre;ST.form.apellido=apellido;ST.form.empresa=empresa;
    ST.form.unidad=document.getElementById('fUnidad')?.value?.trim()||ST.empleadoData?.unidad_de_negocio||'';
    ST.form.sexo=document.getElementById('fSexo')?.value||'M';
    ST.form.fechaNacimiento=document.getElementById('fFechaNac')?.value||'';
    ST.form.infoGeneral=document.getElementById('fInfoGeneral')?.value?.trim()||'';
    ST.error=null;ST.screen='encuadre';render();
  });

  document.getElementById('btnEmpezar')?.addEventListener('click',()=>{
    ST.ans=Array(24).fill(null).map(()=>({mi:null,li:null}));
    ST.cur=0;ST.sel='most';
    TIMER.start=Date.now();TIMER.setTimes=[];TIMER.startSet(0);
    ST.screen='q';render();
  });

  document.querySelectorAll('.ph-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const pi=parseInt(btn.dataset.pi);
      const a=ST.ans[ST.cur];
      if(ST.sel==='most'){
        a.mi=pi;ST.sel='least';render();
      }else{
        if(pi===a.mi)return;
        a.li=pi;
        TIMER.endSet(ST.cur);
        if(ST.cur<23){
          ST.cur++;ST.sel='most';TIMER.startSet(ST.cur);render();
        }else{
          finalizarEvaluacion();
        }
      }
    });
  });

  // Búsqueda de reporte (uso interno)
  ['bEmpresa','bTermino'].forEach((id,idx)=>{
    const keys=['empresa','termino'];
    document.getElementById(id)?.addEventListener('input',e=>{ST.buscar[keys[idx]]=e.target.value;});
  });
  document.getElementById('btnBuscarReporte')?.addEventListener('click',async()=>{
    const empresa=document.getElementById('bEmpresa')?.value?.trim();
    const termino=document.getElementById('bTermino')?.value?.trim()||'';
    if(!empresa){ST.error='Ingresá la empresa.';render();return;}
    ST.buscar.empresa=empresa;ST.buscar.termino=termino;
    try{
      const rows=await sbGet('colaboradores',{empresa});
      const filtrados=termino?rows.filter(r=>(r.colaborador||'').toLowerCase().includes(termino.toLowerCase())||String(r.employee_id_number||'')===termino):rows;
      ST.candidatosEncontrados=filtrados;ST.error=null;
    }catch(e){ST.error='Error al conectar con el sistema.';}
    render();
  });
  document.querySelectorAll('[data-action="verReporte"]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      ST.reporteData=ST.candidatosEncontrados[parseInt(btn.dataset.idx)];
      ST.screen='reporte';render();
    });
  });
  document.getElementById('btnVolverBusqueda')?.addEventListener('click',()=>{
    ST.screen='buscarReporte';ST.candidatosEncontrados=null;ST.reporteData=null;render();
  });
}

// ── FINALIZAR ─────────────────────────────────────────────────────────────────
async function finalizarEvaluacion(){
  ST.screen='saving';render();
  const profiles=computeProfiles(ST.ans);
  const{U,M,C}=profiles;
  const rasgosU=derivarRasgos(U.D,U.I,U.S,U.C);
  const rasgosM=derivarRasgos(M.D,M.I,M.S,M.C);
  const stress=calcularStress(rasgosU,rasgosM);
  const[rol1,rol2,rol3]=calcularTop3Roles(rasgosU);
  const consist=calcularConsistencia(ST.ans);
  const totalSec=TIMER.totalSec();
  const nombreCompleto=`${ST.form.apellido}, ${ST.form.nombre}`.replace(/^,\s*/,'').replace(/,\s*$/,'');

  ST.result={name:nombreCompleto,saved:false};

  try{
    const fila={
      empresa:ST.form.empresa, unidad_de_negocio:ST.form.unidad||'',
      fecha:today(), colaborador:nombreCompleto, sexo:ST.form.sexo,
      fecha_nacimiento: ST.form.fechaNacimiento||null,
      info_general: ST.form.infoGeneral||'',
      independencia:rasgosU['Independencia'], entusiasmo:rasgosU['Entusiasmo'],
      amistoso:rasgosU['Amistoso'], cooperativismo:rasgosU['Cooperativismo'],
      exactitud:rasgosU['Exactitud'], automotivacion:rasgosU['Automotivacion'],
      auto_confianza:rasgosU['Auto Confianza'], sensitividad:rasgosU['Sensitividad'],
      pensador_objetivo:rasgosU['Pensador Objetivo'], persistencia:rasgosU['Persistencia'],
      paciencia:rasgosU['Paciencia'], eficiencia:rasgosU['Eficiencia'],
      rol_preferido_1:rol1, rol_preferido_2:rol2, rol_preferido_3:rol3,
      d_score:U.D, i_score:U.I, s_score:U.S, c_score:U.C,
      mask_scores:{d:M.D,i:M.I,s:M.S,c:M.C},
      rasgos_mask:rasgosM,
      stress:stress,
      tiempo_evaluacion_seg: totalSec,
      consistencia_interna: Math.round(consist*100),
    };
    if(ST.modo==='empleado'&&ST.form.legajo){
      fila.estado='Activo';
      await sbUpdate('colaboradores',fila,{employee_id_number:ST.form.legajo});
    }else{
      fila.estado='Activo';fila.tipo='candidato';fila.employee_id_number=null;
      await sbInsert('colaboradores',fila);
    }
    ST.result.saved=true;
  }catch(e){console.error(e);ST.result.saved=false;}
  ST.screen='result';render();
}

// ── UTILIDAD DE MIGRACIÓN (uso manual desde la consola del navegador) ─────────
// Los registros guardados ANTES de esta corrección tienen los 12 rasgos
// calculados con la fórmula vieja (mezcla ponderada, no diferencia entre
// factores). Como el score Underlying (d_score/i_score/s_score/c_score)
// siempre se guardó, se puede recalcular todo sin pedirle a nadie que repita
// la evaluación. Para correrlo: abrir esta página, F12 → Consola, y ejecutar:
//   await recalcularHistoricos('Nombre Exacto De La Empresa')
// (sin argumento recalcula TODAS las empresas — usar con cuidado)
window.recalcularHistoricos = async function(empresa){
  const filtro = empresa ? {empresa} : {};
  const rows = await sbGet('colaboradores', filtro);
  let ok=0, fail=0;
  for(const r of rows){
    if(r.d_score==null||r.i_score==null||r.s_score==null||r.c_score==null){fail++;continue;}
    try{
      const rasgosU = derivarRasgos(r.d_score,r.i_score,r.s_score,r.c_score);
      const [rol1,rol2,rol3] = calcularTop3Roles(rasgosU);
      const patch = {
        independencia:rasgosU['Independencia'], entusiasmo:rasgosU['Entusiasmo'],
        amistoso:rasgosU['Amistoso'], cooperativismo:rasgosU['Cooperativismo'],
        exactitud:rasgosU['Exactitud'], automotivacion:rasgosU['Automotivacion'],
        auto_confianza:rasgosU['Auto Confianza'], sensitividad:rasgosU['Sensitividad'],
        pensador_objetivo:rasgosU['Pensador Objetivo'], persistencia:rasgosU['Persistencia'],
        paciencia:rasgosU['Paciencia'], eficiencia:rasgosU['Eficiencia'],
        rol_preferido_1:rol1, rol_preferido_2:rol2, rol_preferido_3:rol3,
      };
      // Si hay mask_scores guardado, recalcular también rasgos_mask + stress
      const ms = r.mask_scores;
      if(ms && (ms.d??ms.D)!=null){
        const rasgosM = derivarRasgos(ms.d??ms.D, ms.i??ms.I, ms.s??ms.S, ms.c??ms.C);
        patch.rasgos_mask = rasgosM;
        patch.stress = calcularStress(rasgosU, rasgosM);
      }
      const filtroFila = r.employee_id_number ? {employee_id_number:r.employee_id_number} : {colaborador:r.colaborador, empresa:r.empresa};
      await sbUpdate('colaboradores', patch, filtroFila);
      ok++;
    }catch(e){console.error('Error con',r.colaborador,e);fail++;}
  }
  console.log(`Recalculado: ${ok} OK, ${fail} con error/sin scores.`);
  return {ok,fail,total:rows.length};
};

render();
</script>
